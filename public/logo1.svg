<svg width="200" height="50" viewBox="0 0 200 50" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>HungerBox Logo</title>

  <!-- Box icon -->
  <g transform="translate(0, 3)">
    <!-- Box body -->
    <rect x="2" y="18" width="36" height="26" rx="3" fill="#F4A020"/>
    <!-- Box lid left flap -->
    <polygon points="2,18 18,18 18,8 2,11" fill="#C47E10"/>
    <!-- Box lid right flap -->
    <polygon points="20,18 38,18 38,11 20,8" fill="#C47E10"/>
    <!-- Box lid center -->
    <rect x="8" y="6" width="24" height="13" rx="2" fill="#F4A020"/>
    <!-- Steam -->
    <path d="M13 5 Q15 2 13 -1" stroke="#F9C46A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M20 4 Q22 1 20 -2" stroke="#F9C46A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M27 5 Q29 2 27 -1" stroke="#F9C46A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Center stripe -->
    <rect x="18" y="18" width="4" height="26" fill="#C47E10" opacity="0.4"/>
  </g>

  <!-- HUNGER text -->
  <text x="48" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1" fill="#CCCCCC">HUNGER</text>
  <!-- BOX text -->
  <text x="48" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#F4A020">BOX</text>
</svg>
